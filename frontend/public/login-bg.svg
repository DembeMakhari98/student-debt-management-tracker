<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003242"/>
      <stop offset=".55" stop-color="#00264a"/>
      <stop offset="1" stop-color="#002971"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".85" cy=".1" r=".55">
      <stop offset="0" stop-color="#00A1ED" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00A1ED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".1" cy=".95" r=".5">
      <stop offset="0" stop-color="#009FB0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#009FB0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65C7DE" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#65C7DE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00A1ED" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A1ED" stop-opacity=".18"/>
      <stop offset="1" stop-color="#006690" stop-opacity=".0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

