  <path d="M0 770 C 300 700 520 840 820 780 S 1300 650 1600 720 L1600 1000 L0 1000 Z" fill="#001c33" fill-opacity=".55"/>
  <path d="M0 600 C 300 520 560 700 860 630 S 1330 470 1600 540" fill="none" stroke="url(#wave1)" stroke-width="2"/>
  <path d="M0 640 C 320 560 580 740 880 670 S 1340 510 1600 580" fill="none" stroke="url(#wave1)" stroke-width="1.4"/>
  <path d="M0 680 C 340 600 600 780 900 710 S 1350 550 1600 620" fill="none" stroke="url(#wave1)" stroke-width="1"/>

  <circle cx="1310" cy="260" r="180" fill="none" stroke="#65C7DE" stroke-opacity=".08" stroke-width="1.5"/>
  <circle cx="1310" cy="260" r="260" fill="none" stroke="#65C7DE" stroke-opacity=".05" stroke-width="1.5"/>
  <circle cx="1310" cy="260" r="340" fill="none" stroke="#65C7DE" stroke-opacity=".03" stroke-width="1.5"/>
