<svg [attr.viewBox]="viewBox" preserveAspectRatio="xMidYMid meet" style="width:100%;height:298px">
  @for (g of gridLines(); track g.label.text) {
    <line [attr.x1]="g.line.x1" [attr.y1]="g.line.y1" [attr.x2]="g.line.x2" [attr.y2]="g.line.y2"
          stroke="var(--border)" stroke-width="1"/>
    <text [attr.x]="g.label.x" [attr.y]="g.label.y" text-anchor="end">{{ g.label.text }}</text>
  }
  @if (highlight(); as h) {
    <rect [attr.x]="h.x" [attr.y]="h.y" [attr.width]="h.width" [attr.height]="h.height"
          fill="var(--ai-blue)" opacity="0.06" rx="6"/>
  }
  @for (b of bars(); track $index) {
    <rect [attr.x]="b.x" [attr.y]="b.y" [attr.width]="b.width" [attr.height]="b.height"
          [attr.fill]="b.fill" [attr.opacity]="b.opacity" rx="2"><title>{{ b.title }}</title></rect>
  }
  @for (t of totalLabels(); track $index) {
    <text [attr.x]="t.x" [attr.y]="t.y" text-anchor="middle" fill="var(--fg-1)" style="font-weight:700">{{ t.text }}</text>
  }
  @for (y of yearLabels(); track y.text) {
    <text [attr.x]="y.x" [attr.y]="y.y" text-anchor="middle"
          [attr.fill]="y.bold ? 'var(--fg-1)' : 'var(--fg-3)'" [style.font-weight]="y.bold ? 700 : 400">{{ y.text }}</text>
  }
</svg>
