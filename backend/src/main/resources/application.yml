spring:
  application:
    name: student-debt-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_debt_tracker}
    username: ${DB_USERNAME:debt_tracker}
    password: ${DB_PASSWORD:debt_tracker}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Liquibase owns the schema — Hibernate only ever validates it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    liquibase: INFO
